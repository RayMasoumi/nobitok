name: nobitok
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:

    sdk: flutter




  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  flutter_bloc: ^8.1.3
  bloc_test: ^9.1.4
  equatable: ^2.0.5
  connectivity_plus: ^4.0.2
  persian_datetime_picker: ^2.5.1
  http: ^1.1.0
  get_storage: ^2.1.1
  loader_overlay: ^2.3.2
  flutter_spinkit: ^5.2.0
  persian_number_utility: ^1.1.3
  material_design_icons_flutter: ^7.0.7296
  text_scroll: ^0.2.0
  dropdown_button2: ^2.3.9


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^2.0.3


flutter:

  uses-material-design: true


  assets:
    - assets/icons/
    - assets/images/


  fonts:
    - family: Kalameh
      fonts:
        - asset: assets/fonts/Kalameh Bold.ttf

    - family: Iranyekan
      fonts:
        - asset: assets/fonts/Qs_Iranyekan.ttf
        - asset: assets/fonts/Qs_Iranyekan thin.ttf
          weight: 100
        - asset: assets/fonts/Qs_Iranyekan light.ttf
          weight: 300
        - asset: assets/fonts/Qs_Iranyekan medium.ttf
          weight: 500
        - asset: assets/fonts/Qs_Iranyekan bold.ttf
          weight: 700
        - asset: assets/fonts/Qs_Iranyekan extrabold.ttf
          weight: 800
        - asset: assets/fonts/Qs_Iranyekan black.ttf
          weight: 900

